name: Deploy To Staging

on:
  push:
    branches: [ "staging" ]

env:
  SERVER_HOST: suiteonix.com
  BACKEND_URL: https://api.suiteonix.com
  FRONTEND__IMAGE_NAME: frontend
  BACKEND__IMAGE_NAME: backend

jobs:
  deploy_admin_ui:
    name: Build, Push And Deploy Admin UI To Staging Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Write multi-line string to file
        run: |
          rm -f .env || true
          touch .env
          echo VITE_API_BASE_URL=${{env.BACKEND_URL}} >> .env

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        run: docker build --build-arg VITE_API_BASE_URL=${{env.BACKEND_URL}} -t michaelabelola/suiteonix:${{env.FRONTEND__IMAGE_NAME}}-${{github.run_id}} -t ${{env.FRONTEND__IMAGE_NAME}}-${{github.run_id}} -t ${{env.FRONTEND__IMAGE_NAME}} .

      - name: Push Image to Docker Registry
        run: docker push michaelabelola/suiteonix:${{env.FRONTEND__IMAGE_NAME}}-${{github.run_id}}

      - name: run Image on Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{env.SERVER_HOST}}
          username: root
          password: ${{secrets.SSH_PRIVATE_KEY}}
          #          key: ${{secrets.SSH_PRIVATE_KEY}}
          port: 22
          script: |-
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{secrets.DOCKER_PASSWORD}}
            sudo docker stop ${{env.FRONTEND__IMAGE_NAME}} || true
            sudo docker rm ${{env.FRONTEND__IMAGE_NAME}} || true
            sudo docker rmi ${{env.FRONTEND__IMAGE_NAME}} || true
            sudo docker pull michaelabelola/suiteonix:${{env.FRONTEND__IMAGE_NAME}}-${{github.run_id}}
            sudo docker tag michaelabelola/suiteonix:${{env.FRONTEND__IMAGE_NAME}}-${{github.run_id}} ${{env.FRONTEND__IMAGE_NAME}}
            sudo docker run -d  -p 81:80 --restart unless-stopped --name ${{env.FRONTEND__IMAGE_NAME}} ${{env.FRONTEND__IMAGE_NAME}}

