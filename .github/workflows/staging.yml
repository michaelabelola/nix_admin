name: Deploy To Staging

on:
  push:
    branches: [ "staging" ]

env:
  SERVER_HOST: suiteonix.com
  BACKEND_URL: https://api.suiteonix.com
  DOCKER_IMAGE_REPOSITORY: michaelabelola/suiteonix

jobs:
  deploy_frontends:
    name: Build, Push And Deploy ${{ matrix.label }} To Staging Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Admin UI
            dockerfile: apps/admin/Dockerfile
            image_name: admin-ui
            container_name: admin-ui
            host_port: 81
          - label: Customer UI
            dockerfile: apps/customer/Dockerfile
            image_name: customer-ui
            container_name: customer-ui
            host_port: 82

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker image
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            --build-arg VITE_API_BASE_URL=${{ env.BACKEND_URL }} \
            -t ${{ env.DOCKER_IMAGE_REPOSITORY }}:${{ matrix.image_name }}-${{ github.run_id }} \
            -t ${{ matrix.image_name }}-${{ github.run_id }} \
            -t ${{ matrix.image_name }} .

      - name: Push Image to Docker Registry
        run: docker push ${{ env.DOCKER_IMAGE_REPOSITORY }}:${{ matrix.image_name }}-${{ github.run_id }}

      - name: Run image on server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: root
          password: ${{ secrets.SSH_PRIVATE_KEY }}
          #          key: ${{secrets.SSH_PRIVATE_KEY}}
          port: 22
          script: |-
            sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{secrets.DOCKER_PASSWORD}}
            sudo docker stop ${{ matrix.container_name }} || true
            sudo docker rm ${{ matrix.container_name }} || true
            sudo docker rmi ${{ matrix.image_name }} || true
            sudo docker pull ${{ env.DOCKER_IMAGE_REPOSITORY }}:${{ matrix.image_name }}-${{ github.run_id }}
            sudo docker tag ${{ env.DOCKER_IMAGE_REPOSITORY }}:${{ matrix.image_name }}-${{ github.run_id }} ${{ matrix.image_name }}
            sudo docker run -d -p ${{ matrix.host_port }}:80 --restart unless-stopped --name ${{ matrix.container_name }} ${{ matrix.image_name }}
